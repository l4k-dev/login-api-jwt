services:

  frontend:
    image: node:22-alpine
    container_name: teste-react-frontend
    working_dir: /app

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    ports:
      - "5178:5173"

    command: npm run dev -- --host 0.0.0.0

    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: teste-react-backend
    working_dir: /app

    volumes:
      - ./backend:/app

    ports:
      - "5000:5000"

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION}

      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}

      Email__Username: ${EMAIL_USERNAME}
      Email__Password: ${EMAIL_PASSWORD}
      Email__Host: ${EMAIL_HOST}
      Email__Port: ${EMAIL_PORT}
      

    command: dotnet watch --non-interactive run --urls http://0.0.0.0:5000


  postgres:
    image: postgres:17-alpine
    container_name: teste-react-postgres

    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  frontend_node_modules:
  postgres_data: